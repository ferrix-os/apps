[package]
name = "shelf"
description = "shelf, Ferrix's file manager: tabs, two panes, folder sizes, archives, tags and a trash, drawn by tole"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app (Ferrix's docs/APPS.md): a workspace of its own, a static Linux
# program built with std against the target's own musl. It builds inside a
# Ferrix checkout, where tole and the compositor's libraries are beside it.
[workspace]

[lib]
name = "shelf"
path = "src/lib.rs"

[[bin]]
name = "shelf"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The Wayland client the window runs on: the keyboard and the timer.
compositor-toolkit = { path = "../../system/linux/compositor/toolkit" }
# tole, Ferrix's UI framework: the window's tree from the markup under
# `ui/`, its file chooser's kinds, sizes, dates and searches.
tole = { path = "../../system/linux/tole/tole", features = ["wayland"] }
# The disk's size and room (statvfs): MIT or Apache-2.0.
libc = "0.2.189"
# Zip's deflate and gzip's, for reading archives: pure Rust, MIT, zlib or
# Apache-2.0, the version tole writes its PNGs with.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }

[build-dependencies]
# The markup, compiled into Rust when shelf is built.
tole-compiler = { path = "../../system/linux/tole/tole-compiler" }

# As the compositor's: overflow checks on everywhere.
[profile.dev]
overflow-checks = true
opt-level = 2

[profile.release]
overflow-checks = true
