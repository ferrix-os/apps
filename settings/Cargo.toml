[package]
name = "settings"
description = "Ferrix's Settings: a window of pages, the first of them which applications are started in game mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app (Ferrix's docs/APPS.md): a workspace of its own, a static Linux
# program built with std against the target's own musl. It builds inside a
# Ferrix checkout, where the compositor's libraries are beside it.
[workspace]

[lib]
name = "settings"
path = "src/lib.rs"

[[bin]]
name = "settings"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The applications a launcher lists, their icons, and the game-mode file:
# the same code the launcher reads them with.
compositor-desktop = { path = "../../system/linux/compositor/desktop" }
# PNG and SVG icons, into pixmaps.
compositor-image = { path = "../../system/linux/compositor/image" }
# Fonts, shaping, glyphs and wrapped paragraphs.
compositor-text = { path = "../../system/linux/compositor/text" }
# The Wayland client: the window, the keyboard, the pointer, the buffers.
compositor-toolkit = { path = "../../system/linux/compositor/toolkit" }

# As the compositor's: overflow checks on everywhere.
[profile.dev]
overflow-checks = true
opt-level = 2

[profile.release]
overflow-checks = true
