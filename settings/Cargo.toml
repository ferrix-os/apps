[package]
name = "settings"
description = "Ferrix's Settings: the desktop, the session and the system, page by page, after the customer's design"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app (Ferrix's docs/APPS.md): a workspace of its own, a static Linux
# program built with std against the target's own musl. It builds inside a
# Ferrix checkout, where the compositor's libraries are beside it.
[workspace]

[lib]
name = "settings"
path = "src/lib.rs"

[[bin]]
name = "settings"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The applications a launcher lists and the game-mode file: the same code
# the launcher reads them with.
compositor-desktop = { path = "../../system/linux/compositor/desktop" }
# The Wayland client's events, which tole's window hands back.
compositor-toolkit = { path = "../../system/linux/compositor/toolkit" }
# tole, Ferrix's UI framework: the window's tree, from the markup under
# `ui/`, drawn on the CPU with the desktop's own text, or by Vulkan when
# TOLE_RENDERER asks (`gpu`).
tole = { path = "../../system/linux/tole/tole", features = ["wayland", "gpu"] }
# The settings writer's requests, the trusted prompt's side of them, and
# the image manifest (Ferrix's docs/SETTINGS-WRITER.md §7, §13).
ferrix-settings-client = { path = "../../system/linux/settingsd/client" }

[build-dependencies]
# The markup, compiled into Rust when Settings is built.
tole-compiler = { path = "../../system/linux/tole/tole-compiler" }

# As the compositor's: overflow checks on everywhere.
[profile.dev]
overflow-checks = true
opt-level = 2

[profile.release]
overflow-checks = true
