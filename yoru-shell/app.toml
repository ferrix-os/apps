# yoru-shell, an app (docs/APPS.md): Yoru's dock, after the customer's
# design (docs/DESKTOP.md §6). Every desktop drawn in Yoru carries it
# whether or not the app is installed (xtask's compositor), as waybar is,
# so it is not in an image by default.

[package]
name = "yoru-shell"
version = "0.1.0"
description = "Yoru's shell: the dock, after the customer's Yoru WM design, as layer-shell surfaces drawn with tole"
license = "MIT"
abi = "linux"
arches = ["x86_64", "aarch64", "armv7a"]
depends = []

[[package.files]]
from = "yoru-shell"
to = "bin/yoru-shell"
mode = "755"

# Phosphor's icons as a font (MIT, Phosphor Icons 2.1.1), where the shell
# and the fonts the desktop scans find them, with its licence.
[[package.files]]
from = "share/fonts"
source = "folder"
tree = true
to = "usr/share/fonts/yoru-shell"

[[package.files]]
from = "LICENSE-phosphor"
source = "folder"
to = "usr/share/licenses/yoru-shell/LICENSE-phosphor"
mode = "644"

[build]
kind = "cargo"

[image]
default = false

[check]
host-tests = true

[[smoke]]
run = "yoru-shell --version"
expect = "yoru-shell 0.1.0"
