# term, an app (docs/APPS.md): Ferrix's terminal emulator. Every compositor
# image carries it whether or not the app is installed (xtask's compositor):
# the desktop's keybindings and its launcher start /bin/term. So it is not in
# an image by default.

[package]
name = "term"
version = "0.1.0"
description = "term: Ferrix's terminal emulator, a pseudoterminal, a character grid and a Wayland window"
license = "MIT AND Bitstream-Vera"
abi = "linux"
arches = ["x86_64", "aarch64", "armv7a"]
depends = []

[[package.files]]
from = "term"
to = "bin/term"
mode = "755"

# Hack's licence, which a binary carrying its glyphs must reproduce.
[[package.files]]
from = "LICENSE-hack"
source = "folder"
to = "usr/share/licenses/term/LICENSE-hack"
mode = "644"

[build]
kind = "cargo"

[image]
default = false

[check]
host-tests = true
