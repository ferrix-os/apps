[package]
name = "chooser"
description = "Ferrix's file chooser: tole's FileDialog, after the customer's Key File Dialog design, in a window of its own, which portald opens for org.freedesktop.portal.FileChooser"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app (Ferrix's docs/APPS.md): a workspace of its own, a static Linux
# program built with std against the target's own musl. It builds inside a
# Ferrix checkout, where the compositor's libraries are beside it.
[workspace]

[lib]
name = "chooser"
path = "src/lib.rs"

[[bin]]
name = "chooser"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# The Wayland client's events, which tole's window hands back.
compositor-toolkit = { path = "../../system/linux/compositor/toolkit" }
# tole, Ferrix's UI framework: its FileDialog (Fx.Controls), in a window.
tole = { path = "../../system/linux/tole/tole", features = ["wayland"] }

[build-dependencies]
# The markup, compiled into Rust when the chooser is built.
tole-compiler = { path = "../../system/linux/tole/tole-compiler" }

[profile.dev]
overflow-checks = true
opt-level = 2

[profile.release]
overflow-checks = true
