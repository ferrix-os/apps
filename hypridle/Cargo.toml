[package]
name = "compositor-hypridle"
description = "hypridle: run commands when the seat goes idle and when it comes back, and loginctl's lock-session to reach it"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# An app (Ferrix's docs/APPS.md): a workspace of its own, a static Linux
# program built with std against the target's own musl. It builds inside a
# Ferrix checkout, where the compositor's libraries are beside it.
[workspace]

[[bin]]
name = "hypridle"
path = "src/main.rs"

# Ferrix has no logind: `loginctl lock-session`, which the user's
# hypridle.conf calls, reaches hypridle over its own socket instead
# (src/session.rs, Ferrix's docs/DESKTOP-CLIENTS.md).
[[bin]]
name = "loginctl"
path = "src/bin/loginctl.rs"

[lib]
name = "compositor_hypridle"
path = "src/lib.rs"

[dependencies]
compositor-hyprlang = { path = "../../system/linux/compositor/hyprlang" }
compositor-toolkit = { path = "../../system/linux/compositor/toolkit" }

# As the compositor's: overflow checks on everywhere, and the tests built
# optimised, since they wait on real time.
[profile.dev]
overflow-checks = true
opt-level = 2

[profile.release]
overflow-checks = true
